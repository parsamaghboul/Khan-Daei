    <title>Khan Daei Restaurant</title>
    <link rel="stylesheet" href="../css/style.css">

<body>
    <header class="header">
        <img src="../images/Logo.png" alt="Khan Daei Restaurant Logo" title="Khan Daei Restaurant Logo" height="65"
            width="100">
        <button id="menubtn">|||</button>
        <img src="../images/PayPal_logo.svg" width="100" class="lg1" alt="PayPal" id="lg1">
        <img src="../images/Stripe_Logo,_revised_2016.svg" width="100" class="lg2" alt="Stripe" id="lg2">
        <img src="../images/Apple_Pay_logo.svg" width="100" class="lg1" alt="Apple Pay" id="lg3">
        <img src="../images/Google_Pay_Logo.svg" width="100" class="lg2" alt="Google Pay" id="lg4">
        <img src="../images/Amazon_Pay_logo.svg" width="100" class="lg1" alt="Amazon Pay" id="lg5">
        <button type="button">Call Us:<img src="../images/phone-missing-dynamic-clay.png" alt="phone" width="16"><br>071
            - 33225656</button>
    </header>

    <main>
        <section id="booking2">
            <div>
                <h2><em><span class="first">P</span>ay <span class="first">B</span>ooking <span
                            class="first">F</span>ee:</em></h2>
                <img src="../images/Payment.png" alt="Payment" height="100px">
            </div>
            <div>
                <form id="form">
                    <input type="text" name="fee" value="$0.60" readonly class="input1">
                    <br><br>
                    <input type="text" name="card_number" placeholder="Card Number" class="input1" id="Cnum">
                    <br><br>
                    <input type="password" name="card_pin" placeholder="Card PIN" class="input1" id="Cpin">
                    <br><br>
                    <select name="payment_method" class="input1" id="pm">
                        <option value="" disabled selected hidden>Payment Methods</option>
                        <option value="PayPal">PayPal</option>
                        <option value="Stripe">Stripe</option>
                        <option value="Apple Pay">Apple Pay</option>
                        <option value="Google Pay">Google Pay</option>
                        <option value="Amazon Pay">Amazon Pay</option>
                    </select>
                    <br><br>
                    <button type="submit">Pay & Complete Booking</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer" id="footer">
        <div>
            <h2 class="h2"><em><span class="first">C</span>ontact <span class="first">U</span>s:</em></h2>
            <p>Find our restaurant location and visitor information on Google Maps. Click the map to explore.</p>
            <p>We are committed to quality and trust. Click the certification badges to verify our credentials.</p>
        </div>
        <div>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3892.6215802006836!2d52.52718687786402!3d29.63472980880402!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3fb2130022d8e2bb%3A0x4a4318f77f50aee9!2z2KjYp9i6INqv24zYp9mHINi02YbYp9iz24wg2KfYsdmF!5e0!3m2!1sfa!2s!4v1788241947311!5m2!1sfa!2s" width="120" height="120" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
